name: micro-automation-hub

# Values below are interpolated from the .env file in this directory (see
# env.example). The defaults let the stack boot without a .env for convenience,
# but a real deployment must override at least POSTGRES_PASSWORD.

services:
  db:
    image: postgres:15-alpine
    container_name: automation_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automation}
      POSTGRES_DB: ${POSTGRES_DB:-automation}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-automation} -d ${POSTGRES_DB:-automation}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ../backend
    container_name: automation_backend
    environment:
      # Reaches Postgres over the compose network, so the internal port is
      # always 5432 regardless of what POSTGRES_PORT exposes on the host.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-automation}:${POSTGRES_PASSWORD:-automation}@db:5432/${POSTGRES_DB:-automation}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        # Create React App inlines env vars at build time, so the API URL has
        # to be supplied to the build rather than the running container.
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    container_name: automation_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
